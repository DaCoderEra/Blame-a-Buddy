<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blame a Buddy | Generator AI de Scuze</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Librărie AI gratuită pentru browser (GitHub Pages) -->
    <script src="https://js.puter.com/v2/"></script>
</head>
<body>

    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="container">
        <header class="app-header">
            <div class="logo-icon">🎭</div>
            <h1>Blame-a-Buddy</h1>
            <p>Ai încurcat-o? Scrie ce ai făcut și AI-ul îți livrează o scuză salvatoare.</p>
        </header>

        <section class="card">
            <label for="situation-input">Pentru ce situație cauți o scuză?</label>
            <div class="input-wrapper">
                <textarea 
                    id="situation-input" 
                    rows="3" 
                    placeholder="Ex: Am întârziat 40 de minute la birou / Am uitat să scot carnea din congelator / Nu am învățat pentru test..."
                ></textarea>
            </div>

            <button id="generate-btn" class="primary-btn">
                <span class="btn-text">Caută scuză 🔍</span>
                <span class="spinner hidden"></span>
            </button>

            <!-- Zona rezultat -->
            <div id="result-box" class="result-box hidden">
                <div class="result-header">
                    <span>Scuza ta oficială:</span>
                    <button id="copy-btn" title="Copiază textul" aria-label="Copiază scuza">📋 Copiază</button>
                </div>
                <p id="excuse-output"></p>
            </div>
        </section>

        <footer>
            <p>Creat cu ❤️ de <span class="brand">Blame-a-Buddy</span></p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
